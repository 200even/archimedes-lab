name: V1 Gemini Secret Preflight

on:
  push:
    paths:
      - 'V1_GEMINI_SECRET_PREFLIGHT.txt'

permissions:
  contents: read

jobs:
  secret-present:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify Gemini credential is configured without provider contact
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY is not configured" >&2
            exit 2
          fi
          echo "GEMINI_API_KEY is configured; no provider request was sent."
