name: V1 Determinism

on:
  push:
    paths:
      - 'archimedes_v0/v1_*.py'
      - 'tests/test_v1_*.py'
      - 'scripts/v1_schedule_digest.py'
      - 'V1_SCHEDULE_DIGEST_MANIFEST.json'
      - 'V1_SCHEMA_FREEZE.json'
      - 'V1_PROMPT_MANIFEST.json'
      - 'V1_CRITIC_QUALIFICATION_FIXTURES.json'
      - 'V1_CRITIC_QUALIFICATION_PACKAGE_SPEC.md'
      - 'V1_CRITIC_QUALIFICATION_RESULT_TEMPLATE.json'
      - 'V1_PROVIDER_ADAPTER_FREEZE_DRAFT.md'
      - 'REFEREE_DECISION_V1_PROVIDER_ADAPTER_ACCEPTED.md'
      - 'v1_design/prompts/**'
      - 'pyproject.toml'
      - 'requirements.txt'
      - '.github/workflows/v1_determinism.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v1-determinism-${{ github.ref }}
  cancel-in-progress: true

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        hashseed: [0, 1, 42, 314159]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - run: python -m pip install --upgrade pip
      - run: pip install -e . pytest==9.1.1
      - name: Run complete V1 integrity suite file-by-file
        env:
          PYTHONHASHSEED: ${{ matrix.hashseed }}
        shell: bash
        run: |
          set -euo pipefail
          for f in tests/test_v1_*.py; do
            echo "::group::$f"
            timeout 120s pytest -q "$f"
            echo "::endgroup::"
          done
      - name: Emit frozen schedule digest
        env:
          PYTHONHASHSEED: ${{ matrix.hashseed }}
        run: python scripts/v1_schedule_digest.py | tee v1-digest-${{ matrix.hashseed }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: v1-digest-${{ matrix.hashseed }}
          path: v1-digest-${{ matrix.hashseed }}.json

  compare:
    needs: digest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: v1-digest-*
          path: digests
          merge-multiple: true
      - name: Require byte-identical outputs across hash seeds
        shell: bash
        run: |
          set -euo pipefail
          base=digests/v1-digest-0.json
          for f in digests/v1-digest-*.json; do
            cmp "$base" "$f"
          done
          cat "$base"
