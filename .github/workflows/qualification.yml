name: Synthesizer Qualification

on:
  push:
    paths:
      - QUALIFICATION_TRIGGER.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        ceiling: [256, 512, 1024, 2048, 4096, 8192, 16384, 32768, 65536]
        shard: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - name: Run qualification shard
        shell: bash
        run: |
          start=$(( ${{ matrix.shard }} * 200 ))
          stop=$(( start + 200 ))
          python -m archimedes_v0.qualify_synthesizer \
            --ceiling ${{ matrix.ceiling }} \
            --start "$start" \
            --stop "$stop" \
            --out "qualification-${{ matrix.ceiling }}-${{ matrix.shard }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: qualification-${{ matrix.ceiling }}-${{ matrix.shard }}
          path: qualification-${{ matrix.ceiling }}-${{ matrix.shard }}.json

  aggregate:
    if: always()
    needs: qualify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: qualification-*
          path: reports
          merge-multiple: true
      - name: Aggregate frozen qualification ladder
        shell: bash
        run: |
          python - <<'PY'
          import glob, json
          from collections import defaultdict

          grouped = defaultdict(list)
          for path in glob.glob('reports/qualification-*.json'):
              with open(path, encoding='utf-8') as fh:
                  row = json.load(fh)
              grouped[int(row['ceiling'])].append(row)

          ceilings = [256, 512, 1024, 2048, 4096, 8192, 16384, 32768, 65536]
          results = []
          selected = None
          for ceiling in ceilings:
              rows = grouped.get(ceiling, [])
              count = sum(r['count'] for r in rows)
              recovered = sum(r['recovered'] for r in rows)
              rate = recovered / count if count else None
              complete = count == 1000
              result = {
                  'ceiling': ceiling,
                  'shards_present': len(rows),
                  'count': count,
                  'recovered': recovered,
                  'recovery_rate': rate,
                  'complete': complete,
              }
              results.append(result)
              if selected is None and complete and rate is not None and rate >= 0.95:
                  selected = ceiling

          summary = {
              'status': 'QUALIFIED' if selected is not None else 'NO_CEILING_QUALIFIED',
              'selection_rule': 'smallest preregistered ceiling with complete recovery_rate >= 0.95',
              'selected_search_ceiling': selected,
              'results': results,
          }
          with open('qualification_summary.json', 'w', encoding='utf-8') as fh:
              json.dump(summary, fh, sort_keys=True, indent=2)
              fh.write('\n')
          print(json.dumps(summary, sort_keys=True, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qualification-summary
          path: qualification_summary.json
