name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: general-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - run: python -m pip install --upgrade pip
      - run: pip install -e . pytest==9.1.1
      - name: Run active test suite
        run: pytest -q --ignore=tests/test_synthesis.py --ignore=tests/test_cegis_debug.py
