[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "archimedes-v0"
version = "0.1.3"
description = "Preregistered hidden-world lab, epistemic broker, and pre-exposure agent interfaces"
requires-python = ">=3.11"
dependencies = ["pydantic==2.13.5", "z3-solver==5.1.0.0"]

[tool.setuptools]
packages = ["archimedes_v0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
