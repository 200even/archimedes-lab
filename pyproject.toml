[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "archimedes-v0"
version = "0.1.2"
description = "Preregistered hidden-world generator for the Archimedes V0 epistemic-agent experiment"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
