[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "archimedes-v0"
version = "0.1.3"
description = "Preregistered hidden-world generator and epistemic broker for the Archimedes V0 experiment"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.8", "z3-solver>=4.13"]

[tool.setuptools]
packages = ["archimedes_v0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
